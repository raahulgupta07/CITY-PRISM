services:
  prism:
    build: .
    image: city-prism:latest
    container_name: city-prism
    ports:
      - '8080:8080'
    env_file:
      - path: .env
        required: false
    volumes:
      - prism-data:/app/backend/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

volumes:
  prism-data:
